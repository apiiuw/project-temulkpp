services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: temulkpp-backend:1.0
    container_name: temulkpp-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:80"
    env_file:
      - ./.env.docker
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./app:/var/www/html/app
      - ./bootstrap:/var/www/html/bootstrap
      - ./config:/var/www/html/config
      - ./resources:/var/www/html/resources
      - ./routes:/var/www/html/routes
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
      - ./public:/var/www/html/public
      - ./storage:/var/www/html/storage
    mem_limit: 768m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/up || exit 1"]
      interval: 5s
      timeout: 3s
      start_period: 15s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: temulkpp-frontend:1.0
    container_name: temulkpp-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./public:/app/public
      # Mount resources too: without it Vite compiles a stale copy baked into
      # the image, so edits to resources/css/app.css never reach the browser.
      - ./resources:/app/resources
      # vite.config.js is baked into the image at build time; mount it so
      # watcher settings can be changed without rebuilding the image.
      - ./vite.config.js:/app/vite.config.js
    mem_limit: 384m
    cpus: 0.75
    depends_on:
      backend:
        condition: service_healthy
